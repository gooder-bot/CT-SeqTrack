# KITTI-HTV M2 proposal-innovation arm.
#
# This is a dataset-port of the currently strongest learned architecture, not
# a claim that the nuScenes R1 checkpoint transfers as a KITTI checkpoint.
# It is trained from scratch against seqtrack3d_kitti_htv_w0.yaml with exactly
# the same KITTI-HTV sampling, candidate definition and optimization budget.

dataset: kitti_mf
path: /home/lishengjie/data/cxtrack
version: kitti_tracking
category_name: Car
kitti_frame_period: 0.1
kitti_hv_interval: 1
train_kitti_hv_interval: all
val_kitti_hv_interval: 5
test_kitti_hv_interval: 5
kitti_allow_missing_pointcloud: true

bb_scale: 1.25
bb_offset: 2
point_sample_size: 1024
degrees: false
coordinate_mode: velodyne
up_axis: [0, 0, 1]
preload_offset: 10
data_limit_box: true
train_split: train
val_split: valid
test_split: test
train_type: train_motion_mf
num_candidates: 4
candidate_trajectory_mode: shared_se2
motion_threshold: 0.15
use_augmentation: false
hist_num: 3
empty_box_limit: 3
limit_num_points_in_prev_box: 1

# The backbone retains SeqTrack3D order tokens. Only the dynamics branch,
# adapter and bounded innovation consume effective physical time.
use_real_time: true
main_time_source: order
main_time_current: 0.1
default_time_step: 0.1
pseudo_time_step: 0.1
time_encoding: raw
time_scale: 0.1
time_clip: 4.0
time_fourier_bands: 4
time_hidden_dim: 16
dynamics_time_mode: "true"
dynamics_fixed_delta_t: 0.1

train_virtual_rate_mode: none
val_virtual_rate_mode: none
test_virtual_rate_mode: none
virtual_rate_gap_pattern: [1, 1, 2, 4]
virtual_rate_stride: 2
virtual_rate_drop_every: 5
virtual_rate_drop_prob: 0.0
virtual_rate_seed: 42
virtual_rate_max_gap: 10
virtual_rate_keep_first: true
virtual_rate_keep_last: false
virtual_rate_min_tracklet_len: 1
virtual_rate_burst_keep_lengths: [3, 2, 3]
virtual_rate_burst_skip_lengths: [2, 3, 3]
virtual_rate_manifest_strict: true
virtual_rate_manifest_allow_create: false
virtual_rate_manifest_require_commit_match: false

use_dynamics_encoder: true
dynamics_hidden_dim: 128
dynamics_eps: 0.001
dynamics_use_query_gap: true
dynamics_use_acceleration: false
dynamics_motion_mode: proposal_innovation
velocity_weight: 0.05
dynamics_displacement_weight: 0.01

use_physical_time_adapter: true
physical_time_adapter_hidden_dim: 128
physical_time_adapter_scale: 1.0
physical_time_adapter_warmup_epoch: 5

# Frozen M2 values from the current highest-performing architecture. They are
# transferred without KITTI validation-set tuning.
dynamics_innovation_alpha: 0.75
dynamics_innovation_scale: 1.0
dynamics_innovation_radius_base: 0.5
dynamics_innovation_radius_per_second: 0.5
dynamics_innovation_radius_max: 2.0
dynamics_innovation_warmup_epoch: 5
dynamics_innovation_disable_on_empty_search: true

dynamics_residual_scale: 0.1
dynamics_max_residual_norm: 1.0
dynamics_warmup_epoch: 0
dynamics_long_gap_only: false
dynamics_min_delta_t: 1.0
dynamics_sparse_only: false
dynamics_sparse_point_threshold: 128
dynamics_max_alpha: 0.2
dynamics_residual_gate_hidden_dim: 16
dynamics_residual_init_alpha: 0.0
dynamics_residual_detach_stats: true

use_observability_gate: false
obs_gate_hidden_dim: 64
obs_gate_num_stats: 5
obs_gate_entropy_weight: 0.0
obs_gate_init_obs_bias: 1.0
obs_gate_min_dyn_valid: 0.5
obs_gate_log_stats: true
obs_stats_detach_seg: true

use_twc: false
use_m3_path_distillation: false
m3_variant: "off"
m3_path_weight: 0.0
m4_variant: "off"
use_m4_state_filter: false
use_m4_trajectory_tube: false
m4_time_mode: fixed
m4_fixed_delta_t: 0.1

net_model: seqtrack3d
box_aware: true
center_weight: 2
angle_weight: 10.0
seg_weight: 0.1
bc_weight: 1
ref_center_weight: 0.2
ref_angle_weight: 1
motion_cls_seg_weight: 0.1

use_z: true
limit_box: false
IoU_space: 3

batch_size: 16
workers: 8
# Mixed [1,2,3,5,10] contains about five times the interval-1 samples.
# 36 mixed epochs match the optimizer-step budget of the 180-epoch KITTI
# interval-1 baseline.
epoch: 36
from_epoch: 0
lr: 0.0001
max_lr: 0.001
optimizer: Adam
lr_decay_step: 20
lr_decay_rate: 0.1
wd: 0
gradient_clip_val: 0.0
