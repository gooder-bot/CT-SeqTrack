_base_: 21_ct_joint_full.yaml

experiment_name: ct_seqtrack_joint_repaired

# Version 2 keeps the stable B0 observation path and replaces only the
# recursive-state, B1/Search geometry, evidence and routing contracts.
ct_joint_contract_version: 2

# Fixed from-scratch learner/expert state distribution.  The four horizons
# rotate across slots every epoch so no tracklet subset is tied to one regime.
ct_recursive_rollout_horizons: [1, 2, 4, 8]
ct_recursive_reseed_enabled: true
ct_partition_seed: 42

# B1 is the primary support generator.  Fixed residual margins are used until
# an uncertainty calibration artifact has been promoted.
use_b1_prepass_support: true
search_v3_use_dynamic_sigma: false
search_v3_fixed_margin_parallel: 2.0
search_v3_fixed_margin_perpendicular: 1.0
search_v3_coverage_scale: 2.448

# Availability is structural; coverage/point-quality statistics are router
# features rather than hard prerequisites for learning.
ct_search_relaxed_validity: true
ct_presence_hard_gate: false
ct_presence_balanced_loss: true
ct_query_counterfactual_supervision: true
ct_query_counterfactual_margin: 0.05
ct_search_presence_init_probability: 0.5
