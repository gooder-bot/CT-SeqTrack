# Shared contract for the small, paper-facing CT-SeqTrack v2 experiment set.
# Dataset paths can always be overridden with: --path /your/nuscenes/root
_base_: ../seqtrack3d_nuscenes_w0_shared_se2_scratch.yaml

experiment_family: ct_seqtrack_v2
candidate_trajectory_mode: independent

# SeqTrack3D keeps its stable order tokens. Physical time is consumed only by
# the v2 motion/search path and can be intervened with true/fixed/shuffled.
main_time_source: order
dynamics_time_mode: "true"

# Legacy research branches remain callable through their old YAML files but
# are intentionally excluded from the v2 factorial experiment.
use_ct_v2: false
use_time_guided_search: false
use_physical_time_adapter: false
use_observability_gate: false
use_twc: false
use_m3_path_distillation: false
m3_variant: "off"
m4_variant: "off"
use_m4_state_filter: false
use_m4_trajectory_tube: false

# Training-only fourth-module candidate: canonical point-feature temporal
# consistency.  Defaults are inert so all existing B0--B3 runs keep their
# original state dict and forward path.
use_point_feature_tc: false
pftc_weight: 1.0
pftc_distance_threshold: 0.3
pftc_min_correspondences: 3
pftc_time_weighting: true
pftc_time_scale: 0.5
pftc_time_weight_min: 0.5
pftc_time_weight_max: 3.0
pftc_ramp_epochs: 5
pftc_time_field: effective

# Fixed search budget. Expansion never increases the Transformer token count.
ct_history_training_mode: canonical
ct_history_correlation: 0.75
ct_search_baseline_ratio: 0.75
ct_search_min_expansion_points: 32
ct_search_training_history: canonical
ct_search_base_length: 4.0
ct_search_base_width: 2.0
ct_search_max_length: 16.0
ct_search_max_width: 6.0
ct_search_max_speed: 20.0
ct_search_max_displacement: 12.0
ct_search_width_per_second: 0.25
ct_search_min_displacement: 0.2

# Proposal-fusion defaults. The adaptive gate is observation-biased.
ct_fusion_mode: fixed
ct_fusion_hidden_dim: 64
ct_fusion_context_dim: 16
ct_fusion_max_alpha: 0.75
ct_fusion_init_alpha: 0.25
ct_fusion_detach_context: true
