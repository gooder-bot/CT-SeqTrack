_base_: nuscenes_mini_base.yaml

experiment_name: ct_ordered_motion_precrop
use_ct_v2: true
use_dynamics_encoder: true
use_ordered_trajectory_encoder: true
use_trajectory_adapter: true
use_trajectory_search: true
use_time_guided_search: false
ct_history_training_mode: recursive_candidate
ct_history_recursive_error_scale: 4.0
dynamics_motion_mode: trajectory_adapter

# Ordered GRU trajectory prior.  Its residual-rate head starts at zero, so the
# cold-start proposal is the causal most-recent velocity rather than a random
# displacement.  It predicts xyz+yaw uncertainty for calibrated supervision.
trajectory_step_dim: 64
trajectory_residual_velocity_scale: 4.0
trajectory_initial_sigma: 0.5
velocity_weight: 0.02
dynamics_displacement_weight: 0.01
trajectory_nll_weight: 0.02

# M2-inspired exact no-op feature residual.  Normal cadence is deliberately
# capped at 0.1; irregular gaps can reach full scale.  No coordinate proposal
# is overwritten and no fixed alpha is used.
trajectory_adapter_hidden_dim: 128
trajectory_adapter_scale: 1.0
trajectory_adapter_normal_scale: 0.1
trajectory_adapter_gap_trigger: 1.5
trajectory_adapter_warmup_epoch: 2
trajectory_adapter_l2_weight: 0.0001
use_physical_time_adapter: false
dynamics_innovation_alpha: 0.0
dynamics_innovation_scale: 0.0

# Pre-crop second branch.  The original 1024 B0 points are retained exactly;
# these points are separately encoded, so expanded search never steals tokens.
ct_search_training_history: correlated_candidate
trajectory_search_point_count: 128
trajectory_search_min_points: 16
trajectory_search_base_length: 4.0
trajectory_search_base_width: 2.0
trajectory_search_max_length: 20.0
trajectory_search_max_width: 8.0
trajectory_search_max_speed: 20.0
trajectory_search_max_acceleration: 8.0
trajectory_search_max_displacement: 12.0
trajectory_search_acceleration_weight: 0.5
trajectory_search_sigma_parallel_scale: 2.0
trajectory_search_sigma_perpendicular_scale: 2.0
trajectory_search_min_displacement: 0.2
trajectory_search_min_delta_t: 0.75
trajectory_search_min_gap_ratio: 1.5
trajectory_search_allow_normal_cadence: false

# Train the same checkpoint on mostly normal cadence plus real frame skips.
# This activates the pre-crop branch during training without changing the
# normal validation protocol or synthesizing timestamps.  Ordered histories
# and targets are expressed in the sampled candidate crop-anchor coordinates,
# matching the recursive predicted-box coordinate contract at evaluation.
trajectory_training_irregular_probability: 0.35
trajectory_training_query_gaps: [2, 4]
trajectory_training_transition_gaps: [1, 1, 2, 4]
