_base_: 09_ct_motion_search_v21.yaml

experiment_name: ct_b3_closed_loop_risk_aware_arbitration

# Replace the synthetic one-step continuous mixture with the offline-trained
# closed-loop selective top-1 router.  Candidate producers are inherited from
# B2-v2.1 and loaded from its final checkpoint.
use_advantage_proposal_fusion: false
use_b3_risk_router: true
proposal_inference_mode: full

b3_router_context_dim: 32
b3_router_hidden_dim: 96
b3_gain_threshold: 0.0
b3_enabled_scale: 1.0
b3_radius_base: 0.5
b3_radius_per_second: 0.5
b3_radius_max: 2.0
b3_normal_step_cap: 0.35
b3_gap_step_cap: 0.60

export_proposal_diagnostics: true
export_b3_rollouts: false

