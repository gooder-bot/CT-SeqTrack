_base_: 02_ct_motion_v3.yaml

experiment_name: b2_v22_motion_conditioned_refiner

seed: 42
batch_size: 16
workers: 4
epoch: 20
from_epoch: 0
check_val_every_n_epoch: 5

# Candidate producers are initialized from the composed B2-v2/B2-v2.1
# checkpoint.  Only the v2.2 refiner is trainable in this stage.
use_motion_v3_legacy_fusion: false
use_search_evidence_v2: false
use_search_evidence_v21: false
use_advantage_proposal_fusion: false
use_b3_risk_router: false
use_motion_conditioned_search_v22: true
use_signed_horizon_router: true
v22_freeze_candidate_producers: true
proposal_inference_mode: full_selective
signed_router_enabled_scale: 1.0

search_v22_point_count: 128
search_v22_extension_quota: 64
search_v22_min_points: 3
search_v22_max_speed: 20.0
search_v22_max_acceleration: 8.0
search_v22_max_displacement: 12.0
search_v22_acceleration_weight: 0.5
search_v22_max_yaw_rate: 1.5707963267948966
search_v22_min_displacement: 0.2
search_v22_history_correlation: 0.75

search_v22_feature_dim: 128
search_v22_query_dim: 32
search_v22_pool_temperature: 0.5
search_v22_max_vote_offset: 4.0
search_v22_presence_threshold: 0.5
search_v22_radius_base: 0.5
search_v22_radius_per_second: 0.5
search_v22_radius_max: 2.0

search_v22_match_weight: 0.1
search_v22_targetness_weight: 0.2
search_v22_vote_weight: 1.0
search_v22_raw_proposal_weight: 1.0
search_v22_refined_proposal_weight: 1.0
search_v22_presence_weight: 0.2
search_v22_focal_alpha: 0.75
search_v22_focal_gamma: 2.0

# The router is initialized and exported with the checkpoint, but the model
# always emits exact observation while training.  It is fitted offline later.
signed_router_context_dim: 32
signed_router_hidden_dim: 96
signed_gain_threshold: 0.0
signed_radius_base: 0.5
signed_radius_per_second: 0.5
signed_radius_max: 2.0
signed_normal_step_cap: 0.20
signed_gap_step_cap: 0.35

export_proposal_diagnostics: false
export_b3_rollouts: false
