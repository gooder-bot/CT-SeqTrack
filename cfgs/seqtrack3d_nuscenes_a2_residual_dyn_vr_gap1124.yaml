dataset: nuscenes_mf
path: /home/lishengjie/data/nuscenes-mini
version: v1.0-mini
category_name: Car
bb_scale: 1.25
bb_offset: 2
point_sample_size: 1024
degrees: false
coordinate_mode: velodyne
up_axis: [0, 0, 1]
preload_offset: 10
data_limit_box: true
key_frame_only: true
train_split: mini_train
val_split: mini_val
test_split: mini_val
train_type: train_motion_mf
num_candidates: 4
motion_threshold: 0.15
use_augmentation: false
hist_num: 3
empty_box_limit: 3
limit_num_points_in_prev_box: 1

virtual_rate_mode: gap_pattern
virtual_rate_gap_pattern: [1, 1, 2, 4]
virtual_rate_seed: 42
virtual_rate_max_gap: 5
virtual_rate_manifest: ""
virtual_rate_keep_first: true
virtual_rate_keep_last: true
virtual_rate_min_tracklet_len: 6

use_real_time: true
main_time_source: order
main_time_current: 0.1
default_time_step: 0.5
pseudo_time_step: 0.1
time_encoding: raw
time_scale: 0.5
time_clip: 4.0
time_fourier_bands: 4
time_hidden_dim: 16

use_dynamics_encoder: true
dynamics_hidden_dim: 128
dynamics_eps: 0.001
dynamics_use_query_gap: true
dynamics_motion_mode: residual_limited
dynamics_displacement_weight: 0.0
velocity_weight: 0.05
dynamics_use_acceleration: false
dynamics_residual_scale: 0.1
dynamics_max_residual_norm: 1.0
dynamics_warmup_epoch: 5
dynamics_long_gap_only: false
dynamics_min_delta_t: 1.0
dynamics_sparse_only: false
dynamics_sparse_point_threshold: 128
dynamics_max_alpha: 0.2
dynamics_residual_gate_hidden_dim: 16
dynamics_residual_init_alpha: 0.0
dynamics_residual_detach_stats: true

use_observability_gate: false
obs_gate_hidden_dim: 64
obs_gate_num_stats: 5
obs_gate_entropy_weight: 0.0
obs_gate_init_obs_bias: 1.0
obs_gate_min_dyn_valid: 0.5
obs_gate_log_stats: true
obs_stats_detach_seg: true

use_twc: false
twc_weight: 0.05
twc_theta_weight: 0.5
twc_view_a_offsets: [1, 2, 3]
twc_view_b_offsets: [1, 3, 5]
twc_full_history_only: true
twc_candidate_zero_only: false
twc_warmup_epoch: 0
twc_timestamp_eps: 1.0e-06
twc_anchor_eps: 0.0001
twc_delta_eps: 1.0e-05
twc_require_coordinate_anchor: true
twc_fail_on_anchor_mismatch: true
twc_require_shared_current_points: true
twc_fail_on_current_point_mismatch: true
twc_point_eps: 1.0e-06

net_model: seqtrack3d
box_aware: true
center_weight: 2
angle_weight: 10.0
seg_weight: 0.1
bc_weight: 1
ref_center_weight: 0.2
ref_angle_weight: 1
motion_cls_seg_weight: 0.1
use_z: true
limit_box: false
IoU_space: 3

batch_size: 2
workers: 10
epoch: 180
from_epoch: 0
lr: 0.0001
max_lr: 0.001
optimizer: Adam
lr_decay_step: 20
lr_decay_rate: 0.1
wd: 0
gradient_clip_val: 0.0
